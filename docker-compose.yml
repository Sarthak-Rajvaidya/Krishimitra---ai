services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: krishisetu
      POSTGRES_PASSWORD: krishisetu
      POSTGRES_DB: krishisetu
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krishisetu"]
      interval: 5s
      retries: 10
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: [qdrantdata:/qdrant/storage]
volumes:
  pgdata:
  qdrantdata:
